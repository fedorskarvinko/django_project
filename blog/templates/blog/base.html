<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} ES {% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">NDS</h5>
        <nav class="ms-5">
            <a class="p-2 btn btn-outline-primary" href="/catalog">Каталог</a>
            <a class="p-2 btn btn-outline-primary" href="/blog">Блог</a>
            <a class="p-2 btn btn-outline-primary" href="/catalog/contacts/">Контакты</a>
            {% if user.is_authenticated %}
            <form method="post" style="display: inline" action="{% url 'users:logout' %}">
                {% csrf_token %}
                <button class="p-2 btn btn-outline-primary"  type="submit">Выход</button>
            </form>

            {% else %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
        {% include 'blog/footer.html' %}
    </div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
